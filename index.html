<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple sample HTML page">
  <title>Welcome | Sample Page</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(2rem, 6vw, 4rem);
      background: #fff;
      border: 1px solid #e3e8f0;
      border-radius: 1.25rem;
      box-shadow: 0 1.25rem 3rem rgb(23 32 51 / 8%);
    }

    .eyebrow {
      margin: 0 0 .75rem;
      color: #5267d8;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 7vw, 3.5rem);
      line-height: 1.05;
    }

    .intro {
      margin: 1.25rem 0 2rem;
      color: #586174;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    a.button {
      display: inline-block;
      padding: .8rem 1.1rem;
      border-radius: .65rem;
      background: #5267d8;
      color: white;
      font-weight: 650;
      text-decoration: none;
    }

    a.button:hover, a.button:focus-visible { background: #3e50b7; }
    a.button:focus-visible { outline: 3px solid #aeb8ff; outline-offset: 3px; }

    footer {
      margin-top: 2.5rem;
      color: #7a8292;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A simple starting point</p>
    <h1>Welcome to my sample page</h1>
    <p class="intro">This lightweight HTML page is ready for you to customize. Add your own content, colors, and links to make it yours.</p>
    <a class="button" href="mailto:hello@example.com">Get in touch</a>
    <footer>Built with semantic HTML and a little CSS.</footer>
  </main>
</body>
</html>
